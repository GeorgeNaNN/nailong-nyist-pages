<body>
<main>
  <div class="portal">
    <div class="badge-wrap">

<dialog class="about" id="about" aria-labelledby="about-title">
  <h2 id="about-title">关于本站</h2>
  <p>非官方，仅整活分享。“奶龙理工学院”是趣味校名，与南阳理工学院无官方关联。</p>
  <p>跳转目标为南阳理工学院官网：<a href="https://www.nyist.edu.cn/">www.nyist.edu.cn</a>。校徽取自学校公开标识，奶龙为趣味创作素材。</p>
  <p>页面源码：<a href="https://github.com/GeorgeNaNN/nailong-nyist-pages" target="_blank" rel="noopener noreferrer">GeorgeNaNN/nailong-nyist-pages</a></p>
  <form method="dialog"><button>关闭</button></form>
</dialog>
<div class="transition-screen" aria-hidden="true">
  <div class="transition-content"><img src="/badge-emblem.webp" alt="" width="182" height="198"></div>
</div>
<script>
(() => {
  const TARGET = 'https://www.nyist.edu.cn/';
  const stay = new URLSearchParams(location.search).has('stay');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DELAY = 3600;
  const EXIT = reduce ? 80 : 900;
  const body = document.body;
  const bar = document.querySelector('.bar');
  const auto = document.getElementById('auto');
  const about = document.getElementById('about');
  const aboutBtn = document.getElementById('about-btn');
  const laugh = document.getElementById('laugh');
  const audioStatus = document.getElementById('audio-status');
  const mascot = document.getElementById('mascot-btn');
  let elapsed = 0, last = null, raf, leaving = false, exitTimer;
  let soundActive = false, playRequest = 0;
  const paused = () => !auto.checked || about.open || document.hidden || soundActive;

  function setSoundActive(active) {
    soundActive = active;
    body.classList.toggle('sound-playing', active);
    last = null;
    paint();
  }
  async function playLaugh() {
    if (leaving) return;
    mascot.classList.remove('clicked');
    void mascot.offsetWidth;
    mascot.classList.add('clicked');
    const request = ++playRequest;
    setSoundActive(true);
    try {
      laugh.currentTime = 0;
      await laugh.play();
      if (request === playRequest) audioStatus.textContent = '奶龙正在捧腹大笑';
    } catch {
      if (request === playRequest) {
        setSoundActive(false);
        audioStatus.textContent = '音频暂时无法播放，请再点一次奶龙';
      }
    }
  }
  mascot.addEventListener('click', playLaugh);
  mascot.addEventListener('pointerleave', () => mascot.classList.remove('clicked'));
  mascot.addEventListener('blur', () => mascot.classList.remove('clicked'));
  laugh.addEventListener('ended', () => { setSoundActive(false); audioStatus.textContent = ''; });
  laugh.addEventListener('pause', () => { if (laugh.paused) setSoundActive(false); });
  laugh.addEventListener('error', () => { setSoundActive(false); audioStatus.textContent = '音频暂时无法播放，请再点一次奶龙'; });

  function paint() {
    const ratio = Math.min(1, elapsed / DELAY);
    bar.style.strokeDashoffset = 100 * (1 - ratio);
    bar.setAttribute('aria-valuenow', Math.round(ratio * 100));
    body.classList.toggle('paused', paused());
  }
  function tick(now) {
    if (!paused() && last !== null) elapsed += now - last;
    last = now;
    paint();
    if (elapsed >= DELAY) leave();
    else raf = requestAnimationFrame(tick);
  }
  function start() {
    clearTimeout(exitTimer);
    cancelAnimationFrame(raf);
    elapsed = 0;
    last = null;
    leaving = false;
    body.classList.remove('leaving', 'entering');
    void body.offsetWidth;
    body.classList.add('entering');
    paint();
    raf = requestAnimationFrame(tick);
  }
  function leave() {
    if (leaving) return;
    leaving = true;
    elapsed = DELAY;
    cancelAnimationFrame(raf);
    const rect = document.querySelector('.badge').getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 20;
    body.style.setProperty('--exit-x', `${x}px`);
    body.style.setProperty('--exit-y', `${y}px`);
    body.style.setProperty('--exit-radius', `${radius}px`);
    body.classList.add('leaving');
    paint();
    exitTimer = setTimeout(stay ? start : () => location.replace(TARGET), stay ? EXIT + 650 : EXIT);
  }
  auto.addEventListener('change', () => { last = null; paint(); });
  aboutBtn.addEventListener('click', () => {
    if (!leaving) { about.showModal(); last = null; paint(); }
  });
  about.addEventListener('close', () => { last = null; paint(); });
  about.addEventListener('click', e => {
    const rect = about.getBoundingClientRect();
    if (e.target === about && (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom)) about.close();
  });
  document.addEventListener('visibilitychange', () => { last = null; paint(); });
  addEventListener('pageshow', e => { if (e.persisted) start(); });
  aboutBtn.hidden = false;
  auto.parentElement.hidden = false;
  // Start after the layered artwork is ready, with a bounded wait for slow connections.
  Promise.race([
    Promise.all([...document.images].map(img => img.decode().catch(() => {}))),
    new Promise(resolve => setTimeout(resolve, 1500))
  ]).then(() => { if (!leaving) start(); });
})();
</script>
